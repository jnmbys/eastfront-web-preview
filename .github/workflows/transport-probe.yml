name: MP0041 public transport probe
on:
  push:
    branches: [source-main]
    paths: ['scripts/mp0041/public-probe.mjs', '.github/workflows/transport-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/mp0041/public-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp0041-public-transport
          path: transport-probe.json

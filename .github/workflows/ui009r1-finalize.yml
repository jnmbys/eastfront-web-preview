name: UI-009R1 finalize

on:
  push:
    branches:
      - ui009r1-final
    paths:
      - .github/workflows/ui009r1-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ui009r1-final
          fetch-depth: 0
      - name: Apply verified UI-009R1 runtime patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ui009r1_runtime.patch.gz.b64 | gzip -d > /tmp/ui009r1.patch
          git apply --check /tmp/ui009r1.patch
          git apply /tmp/ui009r1.patch
          rm ui009r1_runtime.patch.gz.b64
          rm .github/workflows/ui009r1-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI-009R1 finalize browser interaction hotfix"
          git push origin HEAD:ui009r1-final

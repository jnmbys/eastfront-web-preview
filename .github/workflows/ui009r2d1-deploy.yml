name: UI-009R2D1 finalize
on:
  push:
    branches: [ui009r2d1-deploy]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui009r2d1-deploy
          fetch-depth: 0
      - name: Apply exact production runtime patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/runtime.patch.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/runtime.patch.gz.b64 | gunzip > /tmp/runtime.patch
          patch -p1 < /tmp/runtime.patch
          test "$(git hash-object app/main.js)" = "d9fe60c0464011099a77ca993fe064d901005481"
          test "$(git hash-object app/render/terrainSurface.js)" = "5b03ee630b7c9dd4cd9da246c56bcce125d223fe"
          test "$(git hash-object app/web/preview.js)" = "a2c95d4dcbf2a538748cec2e3b857f5b2139709f"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ui009r2d1-deploy.yml
          git add app/main.js app/render/terrainSurface.js app/web/preview.js
          git commit -m 'UI-009R2D1 harden mobile terrain startup loader'
          git push origin HEAD:ui009r2d1-deploy

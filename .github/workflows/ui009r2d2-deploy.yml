          sed -i "s/UI-009R2D1/UI-009R2D2/" app/web/preview.js
          rm .github/workflows/ui009r2d2-deploy.yml
          git add -A
          tree=$(git write-tree)
          echo "tree=$tree"
          test "$tree" = "97ea7f66f48b09de390013ddf349fde68ff37219"
          git config user.name "github-actions[bot]"

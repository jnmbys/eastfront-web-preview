name: UI-009R2D2 finalize
on:
  push:
    branches: [ui009r2d2-deploy]
    paths: ['.github/workflows/ui009r2d2-deploy.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui009r2d2-deploy
          fetch-depth: 0
      - name: Materialize exact validated D2 bytes
        shell: bash
        run: |
          cat .github/d2parts/part1.txt .github/d2parts/part2.txt .github/d2parts/part3.txt .github/d2parts/part4.txt | tr -d '\n' | base64 -d | gunzip > app/render/terrainSurface.js
          sed -i 's/UI-009R2D1/UI-009R2D2/' app/web/preview.js
          rm -rf .github/d2parts .github/workflows/ui009r2d2-deploy.yml
          git add -A
          tree=$(git write-tree)
          echo "tree=$tree"
          test "$tree" = "97ea7f66f48b09de390013ddf349fde68ff37219"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "UI-009R2D2 fix mobile terrain request lifecycle"
          git push origin HEAD:ui009r2d2-deploy

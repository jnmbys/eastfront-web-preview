name: UI-009R1 Safari renderer hotfix
on:
  push:
    branches: [ui009r1-safari-hotfix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui009r1-safari-hotfix
      - name: Apply exact renderer compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/render/productionTerrain.js')
          s=p.read_text()
          needle="export function terrainAssetTransform(entry, c, seed, salt = '') { return imageTransform(entry, c, seed, salt); }\n"
          helper='function svgImageHref(url) { return `href="${url}" xlink:href="${url}"`; }\n'
          if helper not in s:
              assert needle in s
              s=s.replace(needle, needle+helper, 1)
          replacements={
            '<image href="${assetUrl(entry, assetSet)}"':'<image ${svgImageHref(assetUrl(entry, assetSet))}',
            '<image href="${assetUrl(chosen, assetSet)}"':'<image ${svgImageHref(assetUrl(chosen, assetSet))}',
            '<image href="${assetUrl(e, assetSet)}"':'<image ${svgImageHref(assetUrl(e, assetSet))}',
            '<image href="${assetUrl(br, assetSet)}"':'<image ${svgImageHref(assetUrl(br, assetSet))}',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace('<defs><clipPath id="${clip}"><polygon points="${polygonPointsString(c)}"/></clipPath></defs>','')
          p.write_text(s)
          q=Path('app/render/coreSvg.js')
          t=q.read_text()
          old='<svg id="eastfront-map" data-renderer-mode="${mode}"'
          new='<svg id="eastfront-map" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-renderer-mode="${mode}"'
          assert old in t or new in t
          t=t.replace(old,new,1)
          q.write_text(t)
          PY
          test "$(git hash-object app/render/productionTerrain.js)" = "c4e1bf93af53069567fabca46a8212574513639a"
          test "$(git hash-object app/render/coreSvg.js)" = "7050ce904ac2eb8129125a6b87616290046fe835"
          rm .github/workflows/ui009r1-safari-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'UI-009R1 Safari production renderer compatibility hotfix'
          git push origin HEAD:ui009r1-safari-hotfix

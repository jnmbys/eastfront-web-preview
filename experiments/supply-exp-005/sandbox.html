<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EASTFRONT · SUPPLY-EXP-005</title>
<link rel="stylesheet" href="/fonts/400.css"><style>*{box-sizing:border-box}.grid>section{min-width:0}.bar label{min-width:0;max-width:100%}body{font:15px/1.5 "Noto Sans SC",system-ui;margin:0;background:#f1f3eb;color:#233f40}main{max-width:1450px;margin:auto;padding:20px}h1{font-size:25px}button,select,input{font:inherit;padding:8px;border:1px solid #9aada1;border-radius:5px;background:white;color:inherit;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:16px}.map{overflow:auto;background:#dfe6d7}svg{width:1050px;display:block}aside{background:white;padding:12px;min-width:0}label{display:grid;font-size:13px}#status{background:#dbe7df;padding:12px}#error{color:#a22}table{font-size:12px;width:100%;border-collapse:collapse}td,th{padding:5px;border-bottom:1px solid #ddd;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.muted{color:#607168;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:minmax(0,1fr)}main{padding:10px}}</style>
<main><h1>EASTFRONT · 行动与补给闭环</h1><p class="muted">SUPPLY-EXP-005 · 本地独立实验，非生产规则。当前候选 A / 完整回合末 / 范围8 / T开。主动行动将改变真实 Core；无胜负定稿，未验证平衡或真人体验。</p>
<div class="bar"><label>短局面<select id="clip"><option value="prepare">备货后推进（4B）</option><option value="isolation">断供后突围／救援（2B）</option><option value="restore">恢复线路后重新进攻（2B）</option></select></label><label>规则<select id="mode"><option value="new">新补给实验</option><option value="old">旧补给独立对照</option></select></label><button id="reset">重置此局面</button><label>玩家视图<select id="viewer"><option value="G">德军</option><option value="S">苏军</option></select></label><button id="active">切换到当前行动方</button><label>事务预算<select id="budget"><option value="3">3秒</option><option value="0.001">超时探针</option></select></label></div>
<p id="guide"></p><p id="status"></p><p id="error" role="alert"></p>
<div class="bar"><label>本方单位<select id="unit"></select></label><button id="options">查看1–2步条件候选</button><label>连续移动路径（或点地图）<input id="path" placeholder="如 C10 D10"></label><button id="move">移动</button><button id="clear">清空路径</button></div>
<div class="bar"><label>攻击单位 ID（空格分隔）<input id="attackers"></label><label>目标格<input id="target"></label><button id="attack">发起攻击</button><input id="repairPair" value="C10 D10" aria-label="修路端点"><button id="repair">修复该铁路</button><button id="phase">结束当前阶段</button><button id="side">放弃本方余下阶段</button><button id="retry">重发上次请求</button><button id="export">导出全知研究回放</button></div>
<p class="muted">移动路径会受真实地形、堆叠、ZOC及阶段限制。攻击后续自动处理损失／撤退，放弃可选战后推进。实际攻击系数取债务系数与本次付款系数的较小值。没有每点一次就补给的按钮：仅苏军回合末自动结算双方。</p>
<div class="grid"><section><div class="map"><svg id="map" viewBox="0 0 1050 650"></svg></div><pre id="candidates"></pre></section><aside><h3>本方库存与实际限制</h3><table><thead><tr><th>ID</th><th>SP</th><th>D</th><th>债务系数</th><th>MP上限</th></tr></thead><tbody id="units"></tbody></table><h3>最近战斗</h3><pre id="combat"></pre><h3>本方迁移</h3><pre id="transition"></pre><h3>枢纽</h3><pre id="hubs"></pre></aside></div></main>
<script>
const $=id=>document.getElementById(id);let data,last=null,busy=false;const guides={prepare:'可先保存储备或自主移动装甲，再结束移动阶段发起攻击。对照模式需明确重置，不能中途换规则。',isolation:'此起点由3个完整回合的合法等待产生短缺；D≥2的单位总移动上限1 MP。可自主突围、反击或由另一方撤离阻断格。',restore:'德军铁路阶段。实验 GH2 位于 D10，C10–D10 尚未修复。可修路接通后等待实际配送，也可继续保存或进攻；修路不立即清债。'};
async function load(cmd){busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const viewer=$('viewer').value;let r=await fetch('/api'+(cmd?'':'?viewer='+viewer),cmd?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...cmd,viewer,budget:+$('budget').value})}:{});const x=await r.json();if(!x.state)throw Error(x.error);data=x;draw()}catch(e){$('error').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function draw(){const s=data.state;$('status').textContent=`${s.mode==='new'?'新补给':'旧补给'} · Core T${s.core_turn} ${s.core_phase} · 当前 ${s.active} 方 · 后勤 ${s.tick} 次 · revision ${s.revision}`;$('error').textContent=data.error||'';$('guide').textContent=guides[s.clip]+(s.mode==='old'?' 旧规则对照：下表显示Core补给状态，SP与D不参与行动。':'');let old=$('unit').value;$('unit').innerHTML=s.units.map(u=>`<option value="${u.id}">${u.id} @ ${u.node}${u.hasMoved?' 已移动':''}</option>`).join('');if(s.units.some(u=>u.id===old))$('unit').value=old;$('units').innerHTML=s.units.map(u=>`<tr><td>${u.id}</td><td>${s.mode==='new'?u.stock/4+'/'+u.cap/4:u.supplyState}</td><td>${s.mode==='new'?u.debt:'—'}</td><td>${s.mode==='new'?u.effect.factor:'Core旧规则'}</td><td>${s.mode==='new'?(u.effect.cap??'原值'):'Core旧规则'}</td></tr>`).join('');$('combat').textContent=JSON.stringify(s.combat_receipt,null,2);$('transition').textContent=JSON.stringify(s.transition,null,2);$('hubs').textContent=s.hubs.map(h=>`${h.id} @ ${h.node} ${h.stock/4} SP`).join('\n');
const pos=Object.fromEntries(s.nodes.map(n=>[n.id,[25+n.x*31,24+n.y*29]]));let svg='';for(const n of s.nodes){const [x,y]=pos[n.id];let pts=Array.from({length:6},(_,i)=>[x+18*Math.cos(i*Math.PI/3),y+18*Math.sin(i*Math.PI/3)].join(',')).join(' ');svg+=`<polygon data-hex="${n.id}" points="${pts}" fill="${n.known?'#e8ecd7':'#cbd5c5'}" stroke="#b3c2ab"/><text x="${x}" y="${y+3}" font-size="7" text-anchor="middle">${n.id}</text>`;}for(const e of s.edges){if(!e.core_railway)continue;const a=pos[e.a],b=pos[e.b];svg+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#718ca2" stroke-width="2" pointer-events="none"/>`;}for(const u of s.units){const [x,y]=pos[u.node];svg+=`<circle cx="${x}" cy="${y}" r="6" fill="${u.id===$('unit').value?'#cf8c36':'#325c58'}" pointer-events="none"/>`;}for(const c of s.contacts){const [x,y]=pos[c.node];svg+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="#a34c38" pointer-events="none">?</text>`;}$('map').innerHTML=svg;$('map').querySelectorAll('[data-hex]').forEach(p=>p.onclick=()=>{$('path').value=($('path').value+' '+p.dataset.hex).trim();$('target').value=p.dataset.hex});}
function action(a){last={op:'action',id:crypto.randomUUID(),revision:data.state.revision,action:a};load(last)}
$('reset').onclick=()=>{last=null;load({op:'reset',clip:$('clip').value,mode:$('mode').value})};$('viewer').onchange=()=>load();$('active').onclick=()=>{$('viewer').value=data.state.active;load()};$('clear').onclick=()=>{$('path').value=''};$('move').onclick=()=>action({type:'MOVE',unitId:$('unit').value,paperPath:$('path').value});$('attack').onclick=()=>action({type:'ATTACK',attackerUnitIds:($('attackers').value||$('unit').value).trim().split(/\s+/),paperTarget:$('target').value});$('repair').onclick=()=>action({type:'RAIL_REPAIR',repairPair:$('repairPair').value});$('phase').onclick=()=>action({type:'END_PHASE'});$('side').onclick=()=>action({type:'END_SIDE'});$('retry').onclick=()=>{if(last)load(last)};$('options').onclick=async()=>{const r=await(await fetch('/options?viewer='+$('viewer').value+'&unit='+$('unit').value)).json();const ids=Object.fromEntries(data.state.nodes.map(n=>[n.coord.q+','+n.coord.r,n.id]));$('candidates').textContent=r.notice+'\n'+r.options.map(p=>p.coords.map(c=>ids[c.q+','+c.r]).join(' → ')+` (${p.cost} MP${p.conditional?'，条件预测':''})`).join('\n')};$('export').onclick=async()=>{const r=await(await fetch('/replay?debug=1')).json();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r)],{type:'application/json'}));a.download='EXP005-omniscient-replay.json';a.click();URL.revokeObjectURL(a.href)};
const params=new URLSearchParams(location.search);if(params.get('clip')){$('clip').value=params.get('clip');$('viewer').value='G';$('reset').click()}else load();
</script>

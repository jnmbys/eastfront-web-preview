<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EASTFRONT · 双人战役</title><style>body{background:#182321;color:#eadfc6;font:18px system-ui;max-width:760px;margin:5vh auto;padding:20px}button,input,a{font:inherit;padding:12px;margin:8px 0}button{background:#59644a;color:white;border:1px solid #acaa83;cursor:pointer}input{width:90%}a{color:#e8cc85;display:block}#notice{min-height:2em}section{border:1px solid #657164;padding:16px;margin:16px 0}</style><a href="/">返回战役入口</a><h1>EASTFRONT · 黑冰双人房间</h1><p>房主德军、另一玩家苏军。双方只看己方授权信息；任一方断线即暂停。</p><p>本批规则：装备分配与省份候选。新房间独立保存，旧战役从首页继续；清除浏览器凭证不会自动找回席位。</p><button id="create">创建独立房间 · 德军</button><section id="invitation" hidden><p>将以下链接复制给受邀的另一玩家；不要公开截图此邀请。</p><input id="inviteLink" readonly><a id="enter">进入德军席位</a></section><section><h2>加入苏军</h2><input id="joinLink" placeholder="粘贴房间邀请链接"><button id="join">加入房间</button></section><p id="notice" role="status"></p><h2>我的房间</h2><div id="rooms"></div><script>
const notice=document.querySelector('#notice');async function api(url,data){const r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{}),d=await r.json();if(!r.ok)throw Error(d.error);return d;}
async function list(){const d=await api('/room/list');document.querySelector('#rooms').replaceChildren(...d.rooms.map(r=>{const a=document.createElement('a');a.href=r.url;a.textContent=(r.seat==='a'?'德军 · 房主':'苏军')+' · '+(r.started?'继续战役':'等待开始')+' · '+r.id.slice(0,8);return a;}));}
const ready=api('/mp/visitor/start',{}).then(list).catch(e=>notice.textContent=e.message);
document.querySelector('#create').onclick=async()=>{await ready;try{const d=await api('/room/create',{});document.querySelector('#invitation').hidden=false;document.querySelector('#inviteLink').value=location.origin+d.joinUrl;document.querySelector('#enter').href=d.url;await list();}catch(e){notice.textContent=e.message;}};
document.querySelector('#join').onclick=async()=>{await ready;try{const u=new URL(document.querySelector('#joinLink').value,location.origin),d=await api('/room/join',{roomId:u.searchParams.get('room'),invite:new URLSearchParams(u.hash.slice(1)).get('invite')});location.href=d.url;}catch(e){notice.textContent=e.message;}};
if(location.hash.includes('invite=')){document.querySelector('#joinLink').value=location.href;history.replaceState(null,'','/rooms');}
</script></html>

# Public independent-campaign preview. User approved publication and independent visitor saves.
services:
  - type: web
    name: eastfront-grand-preview
    runtime: node
    repo: https://github.com/jnmbys/eastfront-web-preview
    branch: grand-release-001-tablet-preview
    buildCommand: npm ci --include=dev && node experiments/grand-release-001/build.mjs
    startCommand: node experiments/grand-release-tablet/public-server.mjs
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    disk:
      name: grand-release-campaign
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: REQUIRE_PERSISTENT_DISK
        value: "1"
      - key: SAVE_DIR
        value: /var/data/grand-public-1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0




<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP-021 查询等待定位</title>

<header><h1>移动查询定位</h1><p>一次暖机 → 正常1 → 正常2 → 正常3。只加载一次地图，每次等恢复操作后导出。出现异常，导出并停止，不刷新重试。</p><label>型号／系统／浏览器 <input id="device" maxlength="120"></label><button id="start" disabled>开始本局</button><button id="export" disabled>导出本次</button><button id="saved" disabled>已保存，继续</button><p id="status">核对版本中</p><small id="version"></small><small>只用于定位，不证明稳定提速。选好合法目标后保持前台五秒。后续可换仍有 MP 的己方棋子，不结束回合。</small></header>
<iframe id="game" title="诊断游戏" src="about:blank"></iframe><section id="result" hidden><p>文本备份在外层页面游戏框下方；JSON 保存失败时可复制此处。两条通道均失败则停止。</p><textarea id="fallback" readonly></textarea></section><script type="module" src="/controller.mjs"></script></html>

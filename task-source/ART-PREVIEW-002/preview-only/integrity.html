<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ART-PREVIEW-002 资源核验</title><style>body{font:16px sans-serif;max-width:900px;margin:30px auto}button{min-height:44px}textarea{width:100%;height:65vh}</style><h1>实际部署资源 SHA256 核验</h1><p>核对同源预览清单的每项内容；不访问生产或后端。</p><button id="verify">核对全部资源</button><p id="status">未开始</p><textarea readonly aria-label="资源核验结果"></textarea><script type="module">
const button=document.querySelector('button'),status=document.querySelector('#status'),out=document.querySelector('textarea');button.onclick=async()=>{button.disabled=true;const failures=[];let checked=0;const sha=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');try{const r=await fetch('./artifact-manifest.json',{cache:'no-store'});if(!r.ok)throw Error('manifest HTTP '+r.status);const bytes=await r.arrayBuffer(),manifestHash=await sha(bytes),manifest=JSON.parse(new TextDecoder().decode(bytes)),entries=Object.entries(manifest.files);let cursor=0;async function worker(){while(cursor<entries.length){const [path,want]=entries[cursor++];try{const res=await fetch('./'+path,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const actual=await sha(await res.arrayBuffer());if(actual!==want)failures.push({path,expected:want,actual});}catch(e){failures.push({path,error:String(e)});}checked++;status.textContent=`已核对 ${checked}/${entries.length}，差异 ${failures.length}`;}}await Promise.all(Array.from({length:4},worker));out.value=JSON.stringify({origin:location.origin,manifestHash,candidate:manifest.candidate,task:manifest.task,total:entries.length,checked,failures,pass:checked===entries.length&&failures.length===0},null,2);}catch(e){out.value=JSON.stringify({checked,failures,error:String(e)},null,2);}finally{button.disabled=false;}};
</script></html>
